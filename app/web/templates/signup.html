{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:420px;margin:30px auto"><h1>Create account</h1>
{% if not settings.signup_open %}<div class="notice warn">Sign-up is closed. Accounts are created by an administrator.</div>{% endif %}
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Name</label><input type="text" name="name" maxlength="120">
<label>Email</label><input type="email" name="email" required>
<label>Password (8+ characters)</label><input type="password" name="password" minlength="8" required>
<button>Create account</button></form></div>
{% endblock %}
